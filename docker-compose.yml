services:
  backend:
    build: ./backend
    environment:
      ALLOWED_ORIGINS: http://localhost:8080
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    environment:
      CSP_CONNECT_SRC: http://localhost:8000 ws://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
